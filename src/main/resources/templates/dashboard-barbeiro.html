<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BarbLine</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">BarbLine</div>
                <div class="nav-buttons">
                    <button class="btn btn-outline" onclick="logout()">Sair</button>
                </div>
            </div>

        </div>
    </header>

    <div class="dashboard-header">
        <div class="container">
            <div class="dashboard-nav">
                <div class="welcome-card">
                    <h3> <span id="nome-barbeiro">Barbeiro</span>!</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="dashboard-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Agendamentos Hoje</h3>
                    <div id="agendamentos-hoje" class="stat-number">8</div>
                </div>
                <div class="stat-card">
                    <h3>Faturamento Mensal</h3>
                    <div id="faturamento-mensal" class="stat-number">R$ 2.450</div>
                </div>
                <div class="stat-card">
                    <h3>Clientes Ativos</h3>
                    <div id="clientes-ativos" class="stat-number">124</div>
                </div>
            </div>
            <div class="dashboard-section">
                <div class="section-header">
                    <h3>Agendamentos do Dia</h3>
                    <div class="date-filter">
                        <input type="date" id="admin-date-filter">
                        <button class="btn btn-secondary">Filtrar</button>
                    </div>
                </div>

                <div class="bookings-table">
                    <div class="table-header">
                        <div>Horário</div>
                        <div>Cliente</div>
                        <div>Serviço</div>
                        <div>Status</div>
                        <div>Valor Total</div>
                        <div>Ações</div>
                    </div>

                    <div class="table-body" id="admin-bookings">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dashBarbeiro.js"></script>
</body>

</html>
