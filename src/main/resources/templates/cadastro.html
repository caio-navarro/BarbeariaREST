<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - BarbLine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">BarbLine</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-outline">Início</a>
                <a href="login.html" class="btn btn-primary">Entrar</a>
                <a href="cadastro.html" class="btn btn-secondary">Cadastrar</a>
            </div>
        </div>
    </div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <h2>Cadastro de Cliente</h2>
        <form id="registro-form" class="registro-form" >
            <div class="form-row">
                <div class="form-group">
                    <label for="reg-nome">Nome Completo</label>
                    <input type="text" id="reg-nome" required>
                </div>
                <div class="form-group">
                    <label for="reg-tel">Telefone WhatsApp</label>
                    <input type="tel" id="reg-tel" required>
                </div>
                <div class="form-group">
                    <label for="reg-cpf">CPF</label>
                    <input type="text" id="reg-cpf" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="reg-senha">Senha</label>
                    <input type="password" id="reg-senha" required>
                </div>
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                Cadastrar
            </button>
        </form>
        <div class="auth-footer">
            <p>Já tem uma conta?
                <a href="login.html">Entre aqui</a>
            </p>
        </div>
    </div>
</div>

<script src="cadastroJs.js"></script>
</body>
</html>
